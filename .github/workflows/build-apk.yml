name: Build Debug APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: reading-room-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-apk-latest
          name: Debug APK (latest)
          body: |
            Automatically built debug APK from `${{ github.ref_name }}` (commit ${{ github.sha }}).
            For testing only, not signed for release.
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
